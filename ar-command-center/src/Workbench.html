<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2328; --muted: #5f6b7a; --faint: #8a94a3;
    --line: #e3e6ea; --accent: #1a73e8; --accent-soft: #e8f0fe;
    --red: #c5221f; --red-soft: #fce8e6; --amber: #b06000; --amber-soft: #fef3e0;
    --green: #137333; --green-soft: #e6f4ea; --purple: #7b1fa2; --purple-soft: #f3e8fd;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 13px/1.4 "Google Sans", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .hidden { display: none !important; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
  .top-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
  .top-row select { flex: 1; min-width: 0; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-weight: 600; }
  .icon-btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
  .icon-btn:hover { background: var(--accent-soft); }
  .icon-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tabs { display: flex; padding: 0 6px; gap: 2px; overflow-x: auto; }
  .tab { flex: 1; border: 0; background: none; padding: 7px 6px 8px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .count { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; line-height: 16px; margin-left: 3px; }

  main { padding: 10px; }
  .full main { padding: 14px 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .full .grid.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .full .grid.k6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; min-width: 0; }
  .kpi .l { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v { font-size: 18px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .kpi .s { font-size: 11px; color: var(--faint); }
  .kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--accent); }

  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 500; line-height: 17px; white-space: nowrap; background: #eef0f3; color: var(--muted); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.blue { background: var(--accent-soft); color: var(--accent); }
  .pill.purple { background: var(--purple-soft); color: var(--purple); }

  /* Lists */
  .search { display: flex; gap: 6px; margin-bottom: 8px; }
  .search input { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .search select { padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; max-width: 45%; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 2px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .75; margin-left: 3px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .item { display: flex; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: flex-start; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #f8fafd; }
  .item .main { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .right { text-align: right; white-space: nowrap; }
  .item .amt { font-weight: 600; }
  .item .tags { margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; }
  .item input[type=checkbox] { margin-top: 3px; }
  .empty { padding: 18px; text-align: center; color: var(--faint); }
  .dots { display: inline-flex; gap: 2px; vertical-align: middle; }
  .dot { width: 8px; height: 8px; border-radius: 2px; background: #e3e6ea; }
  .dot.d-yes { background: #34a853; } .dot.d-ptp { background: var(--accent); } .dot.d-exp { background: #7b1fa2; }
  .dot.d-nd { background: #9aa0a6; } .dot.d-no { background: #ea4335; } .dot.d-leave { background: #fbbc04; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  /* Tables (full mode) */
  table { width: 100%; border-collapse: collapse; }
  th, td { white-space: nowrap; padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; background: #fafbfc; position: sticky; top: 0; cursor: pointer; white-space: nowrap; }
  td.r, th.r { text-align: right; }
  tr.sel td { background: #f1f6fe; }
  tr.clickable { cursor: pointer; } tr.clickable:hover td { background: #f8fafd; }
  .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; }

  /* Detail */
  .back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; margin-bottom: 8px; font-weight: 500; }
  .title { font-size: 16px; font-weight: 700; margin: 0; }
  .full .title { font-size: 20px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
  .kv div:nth-child(odd) { color: var(--muted); white-space: nowrap; }
  .kv div:nth-child(even) { min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .kv div.open { -webkit-line-clamp: unset; }
  .bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: #eef0f3; margin: 6px 0 4px; }
  .bar div { height: 100%; }
  .blegend { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 3px 10px; font-size: 11px; }
  .blegend span i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 6px 11px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: #f4f6f8; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #1765cc; }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .selbar { position: sticky; bottom: 0; background: #202124; color: #fff; border-radius: var(--radius); padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; z-index: 5; }
  .selbar .btn { border-color: #5f6368; background: #303134; color: #fff; }
  .selbar .btn.primary { background: var(--accent); border-color: var(--accent); }
  .inv { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .inv:last-child { border-bottom: 0; }
  .inv.sel { background: #f1f6fe; }
  .inv .main { flex: 1; min-width: 0; }
  .two { display: flex; justify-content: space-between; gap: 8px; }
  .detail-grid { display: grid; gap: 10px; }
  .full .detail-grid { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .tl { border-left: 3px solid var(--line); padding-left: 8px; }
  .tl.PTP { border-color: var(--accent); } .tl.Call { border-color: #34a853; } .tl.Email { border-color: #fbbc04; }
  .tl.Status { border-color: var(--purple); } .tl.WhatsApp { border-color: #25d366; }
  .tl .h { font-size: 11px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-weight: 500; }

  /* Forms / modal */
  .overlay { position: fixed; inset: 0; background: rgba(32, 33, 36, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .full .overlay { align-items: center; }
  .sheet { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 12px 12px 0 0; padding: 14px; }
  .full .sheet { border-radius: 12px; }
  .sheet h2 { margin: 0 0 10px; font-size: 16px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .03em; }
  .field input, .field select, .field textarea { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .field textarea { min-height: 60px; resize: vertical; }
  .quick { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; position: sticky; bottom: -14px; background: #fff; padding: 8px 0; }
  .amt-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .amt-row input { width: 110px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; text-align: right; }

  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #202124; color: #fff; padding: 8px 14px; border-radius: 6px; z-index: 100; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 90%; }
  .toast.err { background: var(--red); }
  .loading { padding: 30px; text-align: center; color: var(--muted); }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .progress { height: 6px; background: #eef0f3; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress div { height: 100%; background: var(--accent); }
  .lb-me td { background: var(--accent-soft); font-weight: 600; }
  .full .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .full .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  svg text { font-family: inherit; }
</style>
</head>
<body data-mode="<?= mode ?>" data-pan="<?= startPan ?>">
<div class="top">
  <div class="top-row">
    <select id="me" title="Whose PANs to show"></select>
    <button class="icon-btn" id="followBtn" title="Follow the PAN you click in the sheet">🎯 Follow</button>
    <button class="icon-btn" id="refreshBtn" title="Reload data">↻</button>
    <button class="icon-btn" id="expandBtn" title="Open full-screen">⤢</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="today">Today<span class="count hidden" id="todayCount"></span></button>
    <button class="tab" data-tab="pans">PANs</button>
    <button class="tab" data-tab="ptps">PTPs<span class="count hidden" id="ptpCount"></span></button>
    <button class="tab" data-tab="stats">Productivity</button>
    <button class="tab hidden" data-tab="team" id="teamTab">Team review</button>
    <button class="tab hidden" data-tab="overview" id="overviewTab">Overview</button>
  </div>
</div>
<main id="view"><div class="loading"><div class="spinner"></div>Loading your workbench…</div></main>
<div id="modal"></div>

<script>
(function () {
  'use strict';
  var MODE = document.body.getAttribute('data-mode') || 'sidebar';
  var START_PAN = document.body.getAttribute('data-pan') || '';
  if (MODE === 'full') document.body.classList.add('full');
  if (MODE === 'full') document.getElementById('expandBtn').classList.add('hidden');
  if (MODE !== 'sidebar') document.getElementById('followBtn').classList.add('hidden');

  var S = {
    init: null, me: '', scope: null, scopeKey: '', tab: 'today', book: null, ptps: null, stats: null,
    review: null, queue: 'broken', overview: null,
    pan: null, panData: null, sel: {}, bookSel: {},
    filter: 'all', sort: 'priority', q: '', follow: false, lastSelPan: '', invSort: { k: 'ageing', d: -1 },
    showAllRows: false
  };
  var BUCKETS = [
    ['b0', 'Not due', '#9aa0a6'], ['b1', '0-30', '#81c995'], ['b2', '31-60', '#fdd663'],
    ['b3', '61-90', '#fbbc04'], ['b4', '91-120', '#f29900'], ['b5', '121-150', '#ea4335'], ['b6', '>150', '#a50e0e']
  ];
  var BUCKET_OF = { 'a.Not Due': 0, 'b.0-30': 1, 'c.31-60': 2, 'd.61-90': 3, 'e.91-120': 4, 'f.121-150': 5, 'g.>151': 6 };

  // ---------- helpers ----------
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[fn].apply(r, args);
    });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function inr(n, full) {
    n = Number(n) || 0;
    var a = Math.abs(n), s;
    if (!full && a >= 1e7) s = (a / 1e7).toFixed(2) + ' Cr';
    else if (!full && a >= 1e5) s = (a / 1e5).toFixed(2) + ' L';
    else s = Math.round(a).toLocaleString('en-IN');
    return (n < 0 ? '-' : '') + '₹' + s;
  }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fd(k) { return k ? k.slice(8, 10) + ' ' + MON[+k.slice(5, 7) - 1] + ' ' + k.slice(2, 4) : ''; }
  function fds(k) { return k ? k.slice(8, 10) + ' ' + MON[+k.slice(5, 7) - 1] : ''; }
  function addDays(k, n) { var d = new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10))); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dow(k) { return new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10))).getUTCDay(); }
  function nextWeekday(k, wd) { var d = addDays(k, 1); while (dow(d) !== wd) d = addDays(d, 1); return d; }
  function nextWorkday(k) { var d = addDays(k, 1); while (dow(d) === 0) d = addDays(d, 1); return d; }
  function pct(x) { return x == null ? '–' : Math.round(x * 100) + '%'; }
  function today() { return S.init.today; }
  function $(id) { return document.getElementById(id); }
  function toast(msg, err) {
    var t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, err ? 6000 : 2800);
  }
  function fail(e) { toast((e && e.message) || String(e), true); }
  function loading(msg) { $('view').innerHTML = '<div class="loading"><div class="spinner"></div>' + esc(msg || 'Loading…') + '</div>'; }
  function statusPill(s) {
    if (!s) return '';
    var c = /Broken|Missed/.test(s) ? 'red' : /Due Today|Partially/.test(s) ? 'amber' : /Kept|^Paid/.test(s) ? 'green' : /Given/.test(s) ? 'blue' : '';
    return '<span class="pill ' + c + '">' + esc(s) + '</span>';
  }
  function tagPill(t) { return t ? '<span class="pill purple">' + esc(t) + '</span>' : ''; }
  function dc(v) { return { 'Yes': 'd-yes', 'PTP': 'd-ptp', 'Expected Payment': 'd-exp', 'Invoice Not Due': 'd-nd', 'No': 'd-no', 'Leave': 'd-leave', 'Holiday': 'd-leave' }[v] || (v ? 'd-yes' : ''); }
  function dots(recent) {
    // recent[0] = today … oldest last; render oldest -> newest
    return '<span class="dots" title="Last 7 days (oldest → today)">' + (recent || []).slice().reverse().map(function (v) {
      return '<i class="dot ' + dc(v) + '" title="' + esc(v || 'no entry') + '"></i>';
    }).join('') + '</span>';
  }
  function ageBar(r) {
    var tot = BUCKETS.reduce(function (s, b) { return s + Math.max(r[b[0]] || 0, 0); }, 0) || 1;
    return '<div class="bar">' + BUCKETS.map(function (b) {
      var v = Math.max(r[b[0]] || 0, 0);
      return v ? '<div style="width:' + (v / tot * 100) + '%;background:' + b[2] + '" title="' + b[1] + ': ' + inr(v) + '"></div>' : '';
    }).join('') + '</div><div class="blegend">' + BUCKETS.map(function (b) {
      return '<span><i style="background:' + b[2] + '"></i>' + b[1] + ' <b class="num">' + inr(r[b[0]] || 0) + '</b></span>';
    }).join('') + '</div>';
  }

  // ---------- boot ----------
  function isLead() { return S.init && ['Team Lead', 'Management', 'Admin'].indexOf(S.init.role) >= 0; }
  function isMgmt() { return S.init && ['Management', 'Admin'].indexOf(S.init.role) >= 0; }
  function scopeFromKey(k) {
    if (!k) return null;
    if (k === 'all') return { all: true };
    if (k.indexOf('t:') === 0) return { teamLead: k.slice(2) };
    return { assoc: k.slice(2) };
  }
  function scopeLabel() {
    var sc = S.scope || {};
    return sc.all ? 'Everyone' : sc.teamLead ? sc.teamLead + '’s team' : sc.assoc;
  }
  function single() { return S.scope && S.scope.assoc; }
  call('ccInit').then(function (init) {
    S.init = init;
    S.me = init.me;
    var sel = $('me');
    var opts = '<option value="">— Select your name —</option><optgroup label="Associates">' + init.associates.map(function (a) {
      return '<option value="a:' + esc(a) + '">' + esc(a) + (a === init.me ? ' (me)' : '') + '</option>';
    }).join('') + '</optgroup>';
    if (isLead() && init.teamLeads.length) {
      opts += '<optgroup label="Teams">' + init.teamLeads.map(function (t) { return '<option value="t:' + esc(t) + '">' + esc(t) + '’s team</option>'; }).join('') + '</optgroup>';
    }
    if (isMgmt() || !init.restrict) opts += '<optgroup label="Everyone"><option value="all">All associates</option></optgroup>';
    sel.innerHTML = opts;
    var def = init.role === 'Team Lead' ? 't:' + init.me : isMgmt() ? 'all' : (init.me ? 'a:' + init.me : '');
    if (init.associates.indexOf(init.me) >= 0 && init.role !== 'Management' && init.role !== 'Admin' && init.role !== 'Team Lead') def = 'a:' + init.me;
    sel.value = def;
    S.scopeKey = sel.value; S.scope = scopeFromKey(S.scopeKey);
    sel.onchange = function () {
      S.scopeKey = sel.value; S.scope = scopeFromKey(sel.value);
      if (S.scope && S.scope.assoc && !init.identified && !S.me) { S.me = S.scope.assoc; call('ccSetMe', S.me); }
      S.book = S.ptps = S.stats = S.review = null; S.pan = null; go(S.tab);
    };
    if (isLead()) $('teamTab').classList.remove('hidden');
    if (isMgmt()) $('overviewTab').classList.remove('hidden');
    if (START_PAN) { openPan(START_PAN); return; }
    go(isMgmt() ? 'overview' : 'today');
  }).catch(fail);

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    S.pan = null; go(b.getAttribute('data-tab'));
  });
  $('refreshBtn').onclick = function () {
    S.book = S.ptps = S.stats = null;
    loading('Refreshing invoice data…');
    S.review = S.overview = null;
    call('ccRefresh').then(function (r) { toast('Rebuilt · ' + r.pans + ' PANs · ' + r.invoices + ' open invoices'); if (S.pan) openPan(S.pan); else go(S.tab); }).catch(fail);
  };
  $('expandBtn').onclick = function () { google.script.run.CC_openFullScreen(S.pan || ''); };
  $('followBtn').onclick = function () {
    S.follow = !S.follow;
    this.classList.toggle('on', S.follow);
    toast(S.follow ? 'Click any PAN row in the sheet to open it here' : 'Follow selection off');
    if (S.follow) poll();
  };
  function poll() {
    if (!S.follow) return;
    if (document.hidden) { setTimeout(poll, 2000); return; }
    call('ccGetSelection').then(function (s) {
      if (s.pan && s.pan !== S.lastSelPan) { S.lastSelPan = s.pan; openPan(s.pan); }
      setTimeout(poll, 1200);

  function kpi(label, value, sub, filter) {

  function panList(rows) {

  function panItem(r, withCheck) {

      '<div class="grid"><div class="field"><label>Green ₹</label><input type="number" id="cGreen" value="' + val(h.greenAmt) + '"></div><div class="field"><label>POE required?</label><select id="cPoe"><option value=""></option><option' + (h.poe === 'Yes' ? ' selected' : '') + '>Yes</option><option' + (h.poe === 'No' ? ' selected' : '') + '>No</option></select></div></div>' +
      '<div class="form-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="fSave">Save</button></div>');
    Array.prototype.forEach.call(document.querySelectorAll('[data-all]'), function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-all'); var amt = Math.round(h.overdue || h.total || 0);
        $('cRed').value = k === 'red' ? amt : ''; $('cAmber').value = k === 'amber' ? amt : ''; $('cGreen').value = k === 'green' ? amt : '';
      };
    });
    $('fSave').onclick = function () {
      call('ccSetConfidence', S.panData.pan, { redAmt: $('cRed').value, amberAmt: $('cAmber').value, greenAmt: $('cGreen').value }, $('cPoe').value)
        .then(function () { closeModal(); toast('Saved'); S.book = null; openPan(S.panData.pan); }).catch(fail);
    };
  }
  function reassignForm() {
    modal('<h2>👤 Reassign ' + esc(S.panData.customer || S.panData.pan) + '</h2><div class="field"><label>New associate</label><select id="fTo">' +
      S.init.associates.map(function (a) { return '<option' + (a === S.panData.owner ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select></div>' +
      '<div class="form-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="fSave">Reassign</button></div>');
    $('fSave').onclick = function () {
      call('ccReassign', [S.panData.pan], $('fTo').value).then(function () { closeModal(); toast('Reassigned'); S.book = null; openPan(S.panData.pan); }).catch(fail);
    };
  }
  function remarkForm(which) {
    var h = S.panData.header || {};
    modal('<h2>' + (which === 'tlRemarks' ? 'Team Lead remark' : 'Associate remark') + '</h2><div class="field"><textarea id="fRem" style="min-height:110px">' + esc(h[which] || '') + '</textarea></div>' +
      '<div class="form-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="fSave">Save</button></div>');
    $('fSave').onclick = function () {
      var v = $('fRem').value;
      call('ccSaveRemark', S.panData.pan, v, which).then(function () {
        closeModal(); toast('Remark saved'); if (S.panData.header) S.panData.header[which] = v; S.book = null; renderPan();
      }).catch(fail);
    };
  }

  // ---------- PTPs ----------
  function renderPtps() {
    var rows = S.ptps.rows;
    var groups = [
      ['🔴 Broken', function (p) { return p.live === 'PTP Broken'; }],
      ['📅 Due today', function (p) { return p.live === 'PTP Due Today'; }],
      ['🟡 Partially paid', function (p) { return p.live === 'Partially Paid'; }],
      ['🔵 Upcoming', function (p) { return p.live === 'PTP Given'; }],
      ['🏷️ Tagged, no PTP', function (p) { return !p.ptpDate && p.tag && p.outstanding > 0; }],
      ['✅ Paid', function (p) { return /^Paid/.test(p.live) && p.ptpDate; }]
    ];
    var sum = function (arr) { return arr.reduce(function (s, p) { return s + (p.outstanding || 0); }, 0); };
    var h = '<div class="grid k4" style="margin-bottom:10px">' + groups.slice(0, 4).map(function (g) {
      var a = rows.filter(g[1]); return kpi(g[0], a.length, inr(sum(a)));
    }).join('') + '</div>';
    groups.forEach(function (g) {
      var a = rows.filter(g[1]);
      if (!a.length) return;
      if (MODE === 'full') {
        h += '<div class="section-title">' + g[0] + ' (' + a.length + ')</div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Invoice</th><th>Brand</th><th>Due date</th>' +
          '<th>PTP date</th><th class="r">Promised</th><th class="r">Outstanding</th><th>Status</th><th>Tag</th><th>Mode</th><th>Contact</th><th>Remarks</th></tr></thead><tbody>' +
          a.map(function (p) {
            return '<tr class="clickable" data-pan="' + esc(p.pan) + '"><td><b>' + esc(p.customer) + '</b></td><td>' + esc(p.invoice) + '</td><td>' + esc(p.brand) + '</td><td>' + fd(p.dueDate) + '</td>' +
              '<td>' + fd(p.ptpDate) + (p.daysLate ? ' <span class="pill red">' + p.daysLate + 'd late</span>' : '') + '</td><td class="r num">' + (p.ptpAmount !== '' ? inr(p.ptpAmount) : '') + '</td>' +
              '<td class="r num">' + inr(p.outstanding) + '</td><td>' + statusPill(p.live) + '</td><td>' + tagPill(p.tag) + '</td><td>' + esc(p.mode) + '</td><td>' + esc(p.contact) + '</td><td>' + esc(p.remarks) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      } else {
        h += section(g[0], a.length, ptpList(a.slice(0, 50)), '');
      }
    });
    if (!rows.length) h += '<div class="card"><div class="empty">No PTPs yet. Open a PAN, tick invoices and press 🤝 PTP.</div></div>';
    $('view').innerHTML = h;
    bindPanClicks();
  }

  // ---------- TEAM REVIEW (team leads) ----------
  var QUEUES = [
    ['broken', '🔴 Broken PTPs'], ['stale', '💤 Not followed 3 days'], ['gt60NoPtp', '⏳ >60 days, no PTP'],
    ['noRemark', '📝 Overdue, no remark'], ['red', '🚦 Red'], ['exposure', '⚠️ Exposure']
  ];
  function renderReview() {
    var d = S.review;
    var h = '<div class="muted" style="margin-bottom:8px">' + (d.teamLead ? esc(d.teamLead) + '’s team' : 'All associates') + ' · ' + d.associates.length + ' associates. Click an associate to open their PANs.</div>';
    h += '<div class="table-wrap"><table><thead><tr><th>Associate</th><th class="r">Active</th><th class="r">Overdue</th><th class="r">&gt;60</th><th class="r">AR-AP</th>' +
      '<th class="r">Today</th><th class="r">MTD cov.</th><th class="r">Stale 3d</th><th class="r">Open PTPs</th><th class="r">Broken</th><th class="r">Kept %</th><th class="r">Remarks</th><th>R / A / G</th></tr></thead><tbody>' +
      d.associates.map(function (a) {
        return '<tr class="clickable" data-assoc="' + esc(a.name) + '"><td><b>' + esc(a.name) + '</b></td><td class="r num">' + a.active + '</td><td class="r num">' + inr(a.overdue) + '</td>' +
          '<td class="r num">' + inr(a.gt60) + '</td><td class="r num">' + inr(a.arap) + '</td><td class="r num">' + a.touchedToday + ' · ' + pct(a.todayCov) + '</td>' +
          '<td class="r num">' + pct(a.mtdCov) + '<div class="progress"><div style="width:' + Math.round(a.mtdCov * 100) + '%"></div></div></td>' +
          '<td class="r num" style="' + (a.stale ? 'color:var(--red);font-weight:600' : '') + '">' + a.stale + '</td><td class="r num">' + a.ptpOpen + '</td>' +
          '<td class="r num" style="' + (a.broken ? 'color:var(--red);font-weight:600' : '') + '">' + a.broken + '</td><td class="r num">' + pct(a.keptRate) + '</td>' +
          '<td class="r num">' + a.remarksFilled + '</td><td class="num" style="font-size:11px">' + inr(a.red) + ' / ' + inr(a.amber) + ' / ' + inr(a.green) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    h += '<div class="chips" style="margin-top:14px">' + QUEUES.map(function (q) {
      return '<button class="chip' + (S.queue === q[0] ? ' on' : '') + '" data-q="' + q[0] + '">' + q[1] + '<span class="n">' + d.queues[q[0]].length + '</span></button>';
    }).join('') + '</div>';
    h += panList(d.queues[S.queue] || []);
    h += '<p class="faint" style="font-size:11px">Open a PAN to add a Team Lead remark, set Red / Amber / Green or reassign it. Lists show the top 30 by amount.</p>';
    $('view').innerHTML = h;
    bindPanClicks();
    Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function (c) { c.onclick = function () { S.queue = c.getAttribute('data-q'); renderReview(); }; });
    bindAssocRows('overdue');
  }
  function bindAssocRows(filter) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-assoc]'), function (tr) {
      tr.onclick = function () {
        var k = 'a:' + tr.getAttribute('data-assoc');
        $('me').value = k; S.scopeKey = k; S.scope = scopeFromKey(k); S.book = null; S.filter = filter || 'all'; S.sort = 'priority'; go('pans');
      };
    });
  }

  // ---------- OVERVIEW (management) ----------
  function renderOverview() {
    var d = S.overview, t = d.total;
    var h = '<div class="muted" style="margin-bottom:8px">Portfolio as of ' + fd(d.today) + (d.lastSync ? ' · last sync ' + esc(d.lastSync) : '') + ' · ' +
      (Math.abs(d.recon.diff) < 1 ? '<span class="pill green">✓ reconciled with Invoices</span>' : '<span class="pill red">Off by ' + inr(d.recon.diff, true) + ' vs Invoices</span>') + '</div>';
    h += '<div class="grid k6" style="margin-bottom:10px">' +
      kpi('Total receivables', inr(t.total), t.pans + ' active PANs') + kpi('Overdue', inr(t.overdue), pct(t.total ? t.overdue / t.total : 0) + ' of total') +
      kpi('>60 days', inr(t.gt60), pct(t.overdue ? t.gt60 / t.overdue : 0) + ' of overdue') + kpi('Possible AR-AP', inr(t.arap), 'historic PANs ' + inr(t.arapHist)) +
      kpi('Coverage MTD', pct(t.mtdCov), t.touched + ' PANs touched today') + kpi('PTPs', t.ptpOpen + ' open', t.broken + ' broken · kept ' + pct(t.keptRate)) + '</div>';
    h += '<div class="cols2"><div class="card"><h3>Ageing (all PANs)</h3>' + ageBar({ b0: t.b[0], b1: t.b[1], b2: t.b[2], b3: t.b[3], b4: t.b[4], b5: t.b[5], b6: t.b[6] }) +
      '<h3 style="margin-top:12px">Collection confidence</h3><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill red">Red ' + inr(t.red) + '</span><span class="pill amber">Amber ' + inr(t.amber) + '</span><span class="pill green">Green ' + inr(t.green) + '</span></div>' +
      '<h3 style="margin-top:12px">IO sign-off</h3><div class="kv"><div>Signed</div><div class="num">' + t.ioDone + '</div><div>Pending</div><div class="num">' + t.ioPending + '</div><div>Incentive collected</div><div class="num">' + inr(t.ioIncentive, true) + '</div></div></div>';
    h += '<div class="card"><h3>Trend (nightly snapshots)</h3>' + overviewTrend(d.trend) + '</div></div>';
    h += '<div class="section-title">By associate <span class="faint" style="text-transform:none;letter-spacing:0">click a row to open their PANs</span></div><div class="table-wrap"><table><thead><tr><th>Associate</th><th>Group</th><th>Team lead</th><th class="r">Active</th><th class="r">Total</th><th class="r">Overdue</th><th class="r">&gt;60</th><th class="r">AR-AP</th><th class="r">Today</th><th class="r">MTD cov.</th><th class="r">Stale 3d</th><th class="r">Open PTPs</th><th class="r">Broken</th><th class="r">Kept %</th><th class="r">IO signed / pending</th></tr></thead><tbody>' +
      d.associates.map(function (a) {
        return '<tr class="clickable" data-assoc="' + esc(a.name) + '"><td><b>' + esc(a.name) + '</b></td><td>' + esc(a.group) + '</td><td>' + esc(a.teamLead) + '</td><td class="r num">' + a.active + '</td>' +
          '<td class="r num">' + inr(a.total) + '</td><td class="r num">' + inr(a.overdue) + '</td><td class="r num">' + inr(a.gt60) + '</td><td class="r num">' + inr(a.arap) + '</td>' +
          '<td class="r num">' + pct(a.todayCov) + '</td><td class="r num">' + pct(a.mtdCov) + '</td><td class="r num">' + a.stale + '</td><td class="r num">' + a.ptpOpen + '</td>' +
          '<td class="r num">' + a.broken + '</td><td class="r num">' + pct(a.keptRate) + '</td><td class="r num">' + a.ioDone + ' / ' + a.ioPending + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    var grp = function (title, rows) {
      return '<div><div class="section-title">' + title + '</div><div class="table-wrap"><table><thead><tr><th>Group</th><th class="r">PANs</th><th class="r">Overdue</th><th class="r">&gt;60</th><th class="r">AR-AP</th></tr></thead><tbody>' +
        rows.map(function (g) { return '<tr><td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">' + esc(g.key) + '</td><td class="r num">' + g.pans + '</td><td class="r num">' + inr(g.overdue) + '</td><td class="r num">' + inr(g.gt60) + '</td><td class="r num">' + inr(g.arap) + '</td></tr>'; }).join('') +
        '</tbody></table></div></div>';
    };
    h += '<div class="cols3">' + grp('By business model', d.byModel) + grp('By BU head', d.byBu) + grp('By team lead', d.byTeamLead) + '</div>';
    h += '<div class="section-title">Top 20 overdue PANs</div>' + panList(d.topOverdue);
    $('view').innerHTML = h;
    bindPanClicks();
    bindAssocRows('all');
  }
  function overviewTrend(tr) {
    if (!tr || tr.length < 2) return '<div class="faint">Trend lines appear after a few nightly snapshots (taken at 23:00 every day).</div>';
    var W = 520, H = 150, pad = 30;
    var max = Math.max.apply(null, tr.map(function (x) { return x.overdue; }).concat([1]));
    var xs = function (i) { return pad + i * (W - pad - 5) / (tr.length - 1); };
    var ys = function (v) { return H - v / max * (H - 10); };
    var line = function (k, col) { return '<polyline fill="none" stroke="' + col + '" stroke-width="2" points="' + tr.map(function (x, i) { return xs(i) + ',' + ys(x[k]); }).join(' ') + '"/>'; };
    return '<svg viewBox="0 0 ' + W + ' ' + (H + 18) + '" width="100%" role="img" aria-label="Overdue and >60 trend">' +
      '<line x1="' + pad + '" x2="' + W + '" y1="' + H + '" y2="' + H + '" stroke="#e3e6ea"/>' + line('overdue', '#1a73e8') + line('gt60', '#ea4335') +
      '<text x="0" y="10" font-size="9" fill="#8a94a3">' + inr(max) + '</text>' +
      '<text x="' + pad + '" y="' + (H + 14) + '" font-size="9" fill="#8a94a3">' + fds(tr[0].date) + '</text><text x="' + (W - 30) + '" y="' + (H + 14) + '" font-size="9" fill="#8a94a3">' + fds(tr[tr.length - 1].date) + '</text></svg>' +
      '<div class="legend"><span><i class="dot d-ptp"></i>Overdue</span><span><i class="dot d-no"></i>&gt;60 days</span></div>';
  }

  // ---------- Productivity ----------
  function renderStats() {
    var d = S.stats, m = d.mine || {}, a = d.acts, p = d.ptp;
    var who = '<div class="muted" style="margin-bottom:8px">Productivity of <b>' + esc(d.who) + '</b>' + (single() ? '' : ' · pick an associate at the top to see someone else') + '</div>';
    var n = function (o) { return Object.keys(o).reduce(function (s, k) { return s + o[k]; }, 0); };
    var h = who + '<div class="grid k6" style="margin-bottom:10px">' +
      kpi('Coverage today', pct(m.todayCov), (m.touchedToday || 0) + ' of ' + (m.active || 0) + ' PANs') +
      kpi('Coverage MTD (avg/day)', pct(m.mtdCov), 'days elapsed this month') +
      kpi('Activities today', n(a.today), n(a.week) + ' this week · ' + n(a.month) + ' MTD') +
      kpi('PTPs given', p.given, inr(p.givenAmt)) +
      kpi('PTP kept rate', pct(p.keptRate), p.kept + ' kept · ' + p.broken + ' broken') +
      kpi('Untouched 3d+', m.untouched3 || 0, 'PANs with balance') + '</div>';
    h += '<div class="cols2"><div class="card"><h3>Daily coverage · last 3 weeks</h3>' + trendChart(m.trend || []) +
      '<div class="legend"><span><i class="dot d-yes"></i>Yes</span><span><i class="dot d-ptp"></i>PTP</span><span><i class="dot d-exp"></i>Expected pmt</span><span><i class="dot d-nd"></i>Not due</span><span><i class="dot d-no"></i>No</span></div></div>';
    h += '<div class="card"><h3>Activity mix</h3>' + actTable(a) +
      '<h3 style="margin-top:12px">PTP outcomes</h3><div class="kv">' +
      '<div>Open</div><div class="num">' + p.open + ' · ' + inr(p.openAmt) + (p.partial ? ' (' + p.partial + ' part-paid)' : '') + '</div>' +
      '<div>Paid on/before PTP</div><div class="num">' + p.kept + '</div><div>Paid after PTP</div><div class="num">' + p.missed + '</div>' +
      '<div>Collected vs PTP</div><div class="num">' + inr(p.keptAmt) + '</div>' +
      '<div>Broken</div><div class="num">' + p.broken + ' · ' + inr(p.brokenAmt) + '</div></div></div></div>';
    h += '<div class="section-title">Team leaderboard</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Associate</th><th class="r">Active PANs</th><th class="r">Today</th><th class="r">MTD coverage</th>' +
      '<th class="r">Untouched 3d+</th><th class="r">Activities MTD</th><th class="r">Overdue</th><th class="r">&gt;60</th></tr></thead><tbody>' +
      d.team.map(function (t, i) {
        return '<tr class="' + (t.assoc === S.stats.who ? 'lb-me' : '') + '"><td>' + (i + 1) + '</td><td>' + esc(t.assoc) + '</td><td class="r num">' + t.active + '</td>' +
          '<td class="r num">' + pct(t.todayCov) + '</td><td class="r num">' + pct(t.mtdCov) + '<div class="progress"><div style="width:' + Math.round(t.mtdCov * 100) + '%"></div></div></td>' +
          '<td class="r num">' + t.untouched3 + '</td><td class="r num">' + t.actsMtd + '</td><td class="r num">' + inr(t.overdue) + '</td><td class="r num">' + inr(t.gt60) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    $('view').innerHTML = h;
  }
  function actTable(a) {
    var types = {};
    ['today', 'week', 'month'].forEach(function (k) { Object.keys(a[k]).forEach(function (t) { types[t] = 1; }); });
    var keys = Object.keys(types);
    if (!keys.length) return '<div class="faint">No workbench activity logged yet this month.</div>';
    return '<table><thead><tr><th>Type</th><th class="r">Today</th><th class="r">Week</th><th class="r">MTD</th></tr></thead><tbody>' +
      keys.map(function (t) { return '<tr><td>' + esc(t) + '</td><td class="r num">' + (a.today[t] || 0) + '</td><td class="r num">' + (a.week[t] || 0) + '</td><td class="r num">' + (a.month[t] || 0) + '</td></tr>'; }).join('') + '</tbody></table>';
  }
  function trendChart(trend) {
    if (!trend.length) return '<div class="faint">No data</div>';
    var W = 520, H = 150, pad = 22, bw = (W - pad) / trend.length;
    var order = [['Yes', '#34a853'], ['PTP', '#1a73e8'], ['Expected Payment', '#7b1fa2'], ['Invoice Not Due', '#9aa0a6'], ['No', '#ea4335']];
    var max = Math.max.apply(null, trend.map(function (t) { return order.reduce(function (s, o) { return s + (t.counts[o[0]] || 0); }, 0); }).concat([1]));
    var svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 20) + '" width="100%" role="img" aria-label="Daily follow-up coverage">';
    svg += '<line x1="' + pad + '" x2="' + W + '" y1="' + H + '" y2="' + H + '" stroke="#e3e6ea"/>';
    svg += '<text x="0" y="10" font-size="9" fill="#8a94a3">' + max + '</text><text x="0" y="' + H + '" font-size="9" fill="#8a94a3">0</text>';
    trend.forEach(function (t, i) {
      var x = pad + i * bw + 2, y = H;
      order.forEach(function (o) {
        var v = t.counts[o[0]] || 0; if (!v) return;
        var hh = v / max * (H - 8);
        y -= hh;
        svg += '<rect x="' + x + '" y="' + y + '" width="' + Math.max(bw - 4, 2) + '" height="' + hh + '" fill="' + o[1] + '"><title>' + fd(t.date) + ' · ' + o[0] + ': ' + v + '</title></rect>';
      });
      svg += '<text x="' + (x + (bw - 4) / 2) + '" y="' + (H + 12) + '" font-size="9" text-anchor="middle" fill="' + (dow(t.date) === 0 ? '#ea4335' : '#8a94a3') + '">' + t.date.slice(8) + '</text>';
    });
    return svg + '</svg>';
  }
})();
</script>
</body>
</html>
