<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1b1f24; --muted: #5b6776; --faint: #8b95a3;
    --line: #e2e6eb; --line2: #eef1f4; --accent: #1a73e8; --accent-ink: #1558c0; --accent-soft: #e8f0fe;
    --red: #c5221f; --red-soft: #fce8e6; --amber: #a55b00; --amber-soft: #fef3e0;
    --green: #137333; --green-soft: #e6f4ea; --purple: #7b1fa2; --purple-soft: #f3e8fd;
    --teal: #00796b; --teal-soft: #e0f2f1; --navy: #1f3864;
    --radius: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 13px/1.42 "Google Sans Text", "Google Sans", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 11px; }
  .hidden { display: none !important; }
  .grow { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 6px; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
  .top-row { display: flex; align-items: center; gap: 5px; padding: 8px 8px 6px; }
  .scope { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-weight: 600; }
  .icon-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 8px; cursor: pointer; white-space: nowrap; line-height: 1.2; }
  .icon-btn:hover { background: var(--accent-soft); }
  .icon-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .role { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-ink); background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
  .tabs { display: flex; padding: 0 4px; gap: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; border: 0; background: none; padding: 6px 7px 7px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; font-size: 12px; }
  .tab .ic { display: block; font-size: 15px; line-height: 1.1; }
  .full .tab { flex: 0 0 auto; padding: 8px 14px 9px; font-size: 13px; }
  .full .tab .ic { display: inline; font-size: 14px; margin-right: 4px; }
  .tab.active { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .tab .count { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; line-height: 15px; margin-left: 2px; }

  main { padding: 10px; }
  .full main { padding: 14px 18px; max-width: 1600px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .full .grid.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .full .grid.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .full .grid.k6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; min-width: 0; box-shadow: var(--shadow); }
  .kpi .l { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v { font-size: 18px; font-weight: 700; margin-top: 1px; white-space: nowrap; letter-spacing: -.01em; }
  .kpi .s { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--accent); }
  .kpi.red .v { color: var(--red); } .kpi.amber .v { color: var(--amber); } .kpi.green .v { color: var(--green); }

  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 500; line-height: 17px; white-space: nowrap; background: #eef0f3; color: var(--muted); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.blue { background: var(--accent-soft); color: var(--accent-ink); }
  .pill.purple { background: var(--purple-soft); color: var(--purple); }
  .pill.teal { background: var(--teal-soft); color: var(--teal); }
  .pill.solid { background: var(--navy); color: #fff; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }

  /* Lists */
  .search { display: flex; gap: 6px; margin-bottom: 8px; }
  .search input { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .search select { padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; max-width: 45%; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 2px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .75; margin-left: 3px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .item { display: flex; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line2); cursor: pointer; align-items: flex-start; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #f7faff; }
  .item .main { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .right { text-align: right; white-space: nowrap; }
  .item .amt { font-weight: 700; }
  .item .tags { margin-top: 3px; }
  .item input[type=checkbox] { margin-top: 3px; }
  .empty { padding: 18px; text-align: center; color: var(--faint); }
  .dots { display: inline-flex; gap: 2px; vertical-align: middle; }
  .dot { width: 8px; height: 8px; border-radius: 2px; background: #e3e6ea; display: inline-block; }
  .dot.d-yes { background: #34a853; } .dot.d-ptp { background: var(--accent); } .dot.d-exp { background: #7b1fa2; }
  .dot.d-nd { background: #9aa0a6; } .dot.d-no { background: #ea4335; } .dot.d-leave { background: #fbbc04; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; }
  th, td { white-space: nowrap; padding: 6px 8px; border-bottom: 1px solid var(--line2); text-align: left; vertical-align: middle; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; background: #f8fafc; position: sticky; top: 0; z-index: 1; }
  th[data-sort] { cursor: pointer; }
  td.r, th.r { text-align: right; }
  tr.sel td { background: #eef4ff; }
  tr.clickable { cursor: pointer; } tr.clickable:hover td { background: #f7faff; }
  tr.tot td { font-weight: 700; background: #f8fafc; }
  .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; box-shadow: var(--shadow); }
  td.wrap { white-space: normal; min-width: 160px; max-width: 280px; }

  /* PAN view */
  .back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; margin-bottom: 8px; font-weight: 600; }
  .hero { background: linear-gradient(135deg, #1f3864 0%, #2b5aa8 100%); color: #fff; border-radius: 12px; padding: 12px 12px 10px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .hero .title { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.25; }
  .full .hero .title { font-size: 20px; }
  .hero .sub { color: #cfe0ff; font-size: 12px; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .hero .pill { background: rgba(255, 255, 255, .16); color: #fff; }
  .hero .pill.red { background: #ffd9d6; color: #8c1d18; } .hero .pill.amber { background: #ffe8c2; color: #7a4300; }
  .hero .pill.green { background: #d6f5df; color: #0d5c2a; } .hero .pill.purple { background: #efdcfb; color: #5c1480; }
  .hero .k4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .full .hero .k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hero .k { background: rgba(255, 255, 255, .1); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .hero .k .l { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #cfe0ff; }
  .hero .k .v { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .hero .k .s { font-size: 10px; color: #cfe0ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy-mini { border: 0; background: rgba(255, 255, 255, .16); color: #fff; border-radius: 5px; padding: 0 5px; cursor: pointer; font-size: 11px; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #eef0f3; margin: 8px 0 4px; }
  .hero .bar { background: rgba(255, 255, 255, .15); }
  .bar div { height: 100%; }
  .blegend { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 2px 10px; font-size: 11px; }
  .hero .blegend { color: #dbe7ff; }
  .blegend span i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .actionbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 6px; margin-bottom: 10px; }
  .abtn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 4px; cursor: pointer; font-weight: 600; font-size: 12px; text-align: center; box-shadow: var(--shadow); }
  .abtn .i { display: block; font-size: 16px; line-height: 1.2; }
  .abtn:hover { border-color: var(--accent); background: #f7faff; }
  .abtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .abtn.primary:hover { background: var(--accent-ink); }
  .menu { position: absolute; right: 0; top: 100%; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 30; min-width: 200px; padding: 4px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
  .menu button:hover { background: var(--accent-soft); }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: #f4f6f8; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .selbar { position: sticky; bottom: 6px; background: #202124; color: #fff; border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .selbar .btn { border-color: #5f6368; background: #303134; color: #fff; }
  .selbar .btn.primary { background: var(--accent); border-color: var(--accent); }
  .bulkptp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid #c9dafc; border-radius: 10px; padding: 7px 9px; margin-bottom: 8px; font-size: 12px; }
  .bulkptp b { color: var(--accent-ink); }
  .bulkptp select, .bulkptp input { padding: 4px 6px; border: 1px solid #c9dafc; border-radius: 6px; background: #fff; }
  .inv { padding: 8px 10px; border-bottom: 1px solid var(--line2); display: flex; gap: 8px; }
  .inv:last-child { border-bottom: 0; }
  .inv.sel { background: #eef4ff; }
  .inv .main { flex: 1; min-width: 0; }
  .ptp-in { padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 12px; width: 126px; }
  .ptp-in.set { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .ptp-in.late { border-color: var(--red); background: var(--red-soft); color: var(--red); }
  .ptp-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .detail-grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .detail-grid > div, .cols2 > div, .cols3 > div, .grid > * { min-width: 0; }
  .bulkptp select { max-width: 100%; min-width: 0; flex: 1 1 140px; }
  .full .detail-grid { grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
  .sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; box-shadow: var(--shadow); overflow: hidden; }
  .sec > summary { list-style: none; cursor: pointer; padding: 9px 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .sec > summary::-webkit-details-marker { display: none; }
  .sec > summary .hint { margin-left: auto; font-weight: 400; color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .sec > summary::after { content: '▸'; color: var(--faint); transition: transform .15s; }
  .sec[open] > summary::after { transform: rotate(90deg); }
  .sec .body { padding: 0 12px 11px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; }
  .kv > div:nth-child(odd) { color: var(--muted); white-space: nowrap; }
  .kv > div:nth-child(even) { min-width: 0; overflow-wrap: anywhere; }
  .kv > div.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .kv > div.clamp.open { display: block; }
  .kv > div.clamp:not(.open)::after { content: ''; }
  body:not(.full) .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
  body:not(.full) .kv > div:nth-child(odd) { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; margin-top: 7px; }
  .preview th { position: static; }
  .form-actions { z-index: 4; }
  .remark { background: #f8fafc; border: 1px solid var(--line2); border-radius: 8px; padding: 7px 9px; white-space: pre-wrap; }
  .remark.tl { background: var(--amber-soft); border-color: #f6dfb6; }
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .tl { border-left: 3px solid var(--line); padding-left: 8px; }
  .tl.PTP { border-color: var(--accent); } .tl.Call { border-color: #34a853; } .tl.Email { border-color: #fbbc04; }
  .tl.Status { border-color: var(--purple); } .tl.WhatsApp { border-color: #25d366; } .tl.IO { border-color: var(--teal); }
  .tl.Reassigned { border-color: var(--red); }
  .tl .h { font-size: 11px; color: var(--muted); }
  .cal { display: flex; gap: 3px; flex-wrap: wrap; }
  .cal div { text-align: center; font-size: 9px; color: var(--faint); }
  .cal i { display: block; width: 16px; height: 16px; border-radius: 4px; margin: 0 auto 1px; background: #e3e6ea; }

  /* Forms / modal */
  .overlay { position: fixed; inset: 0; background: rgba(32, 33, 36, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .full .overlay { align-items: center; }
  .sheet { background: #fff; width: 100%; max-width: 620px; max-height: 94vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 14px; }
  .sheet.wide { max-width: 980px; }
  .full .sheet { border-radius: 14px; }
  .sheet h2 { margin: 0 0 10px; font-size: 16px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .03em; }
  .field input, .field select, .field textarea { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .field textarea { min-height: 58px; resize: vertical; }
  .quick { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; position: sticky; bottom: -14px; background: #fff; padding: 8px 0; }
  .amt-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .amt-row input { width: 120px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; text-align: right; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 5px 10px; cursor: pointer; font-size: 12px; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .preview { border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: 42vh; overflow: auto; background: #fff; }
  .mail-cols { display: flex; gap: 4px; flex-wrap: wrap; }

  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #202124; color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 100; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 92%; }
  .toast.err { background: var(--red); }
  .loading { padding: 30px; text-align: center; color: var(--muted); }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .progress { height: 6px; background: #eef0f3; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress div { height: 100%; background: var(--accent); }
  .lb-me td { background: var(--accent-soft); font-weight: 600; }
  .cols2, .cols3 { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .full .cols2 { grid-template-columns: 1fr 1fr; }
  .full .cols3 { grid-template-columns: repeat(3, 1fr); }
  .ring-card { display: flex; align-items: center; gap: 12px; }
  .banner { background: var(--amber-soft); border: 1px solid #f6dfb6; color: #6b3d00; border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; }
  .health { display: flex; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line2); }
  .health:last-child { border-bottom: 0; }
  .health .ic { font-size: 16px; line-height: 1.2; }
  .asof { font-size: 11px; color: var(--faint); }
  svg text { font-family: inherit; }
  kbd { font: 11px/1 monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 4px; background: #fff; }
</style>
</head>
<body data-mode="<?= mode ?>" data-pan="<?= startPan ?>">
<div class="top">
  <div class="top-row">
    <select class="scope" id="scope" title="Whose book"></select>
    <span class="role hidden" id="roleChip"></span>
    <button class="icon-btn" id="searchBtn" title="Search any PAN, customer, brand or invoice (Ctrl+K)">🔍</button>
    <button class="icon-btn" id="followBtn" title="Follow: click a PAN row in the sheet to open it here">🎯</button>
    <button class="icon-btn" id="refreshBtn" title="Reload data">↻</button>
    <button class="icon-btn" id="expandBtn" title="Open the large workbench window">⤢</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<main id="view"><div class="loading"><div class="spinner"></div>Loading your workbench…</div></main>
<div id="modal"></div>

<script>
(function () {
  'use strict';
  var MODE = document.body.getAttribute('data-mode') || 'sidebar';
  var START_PAN = document.body.getAttribute('data-pan') || '';
  if (MODE === 'full') document.body.classList.add('full');
  if (MODE === 'full') document.getElementById('expandBtn').classList.add('hidden');


  var S = {
    init: null, scope: null, scopeKey: '', tab: 'today', book: null, ptps: null, io: null, stats: null, team: null, overview: null,
    pan: null, panData: null, sel: {}, bookSel: {}, invFilter: 'all',

  function trendChart(trend) {
    if (!trend.length) return '<div class="faint">No data</div>';
    var W = 520, H = 150, pad = 22, bw = (W - pad) / trend.length;
    var order = [['Yes', '#34a853'], ['PTP', '#1a73e8'], ['Expected Payment', '#7b1fa2'], ['Invoice Not Due', '#9aa0a6'], ['No', '#ea4335']];
    var max = Math.max.apply(null, trend.map(function (t) { return order.reduce(function (s, o) { return s + (t.counts[o[0]] || 0); }, 0); }).concat([1]));
    var svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 20) + '" width="100%" role="img" aria-label="Daily follow-up coverage">';
    svg += '<line x1="' + pad + '" x2="' + W + '" y1="' + H + '" y2="' + H + '" stroke="#e3e6ea"/>';
    svg += '<text x="0" y="10" font-size="9" fill="#8a94a3">' + max + '</text><text x="0" y="' + H + '" font-size="9" fill="#8a94a3">0</text>';
    trend.forEach(function (t, i) {
      var x = pad + i * bw + 2, y = H;
      order.forEach(function (o) {
        var v = t.counts[o[0]] || 0; if (!v) return;
        var hh = v / max * (H - 8);
        y -= hh;
        svg += '<rect x="' + x + '" y="' + y + '" width="' + Math.max(bw - 4, 2) + '" height="' + hh + '" fill="' + o[1] + '"><title>' + fd(t.date) + ' · ' + o[0] + ': ' + v + '</title></rect>';
      });
      svg += '<text x="' + (x + (bw - 4) / 2) + '" y="' + (H + 12) + '" font-size="9" text-anchor="middle" fill="' + (dow(t.date) === 0 ? '#ea4335' : '#8a94a3') + '">' + t.date.slice(8) + '</text>';
    });
    return svg + '</svg>';
  }

    if (bad) h += '<div class="banner" id="hJump" style="cursor:pointer">🩺 <b>' + bad + ' data check(s) need attention</b> – the Summary tab may be off. Tap to see.</div>';
    h += '<div class="grid k6" style="margin-bottom:10px">' +
      kpi('Total receivables', inr(t.total), t.active + ' PANs with balance') +
      kpi('Overdue', inr(t.overdue), pct(t.total ? t.overdue / t.total : 0) + ' of total · ' + t.overdueAccts + ' PANs') +
      kpi('>60 days', inr(t.gt60), t.gt60Accts + ' PANs', '', 'amber') +
      kpi('Possible AR-AP', inr(t.possibleArAp), 'historic PANs ' + inr(t.possibleArApHist)) +
      kpi('Coverage today', pct(t.todayCov), t.touchedToday + ' PANs · MTD ' + pct(t.mtdCov)) +
      kpi('Not followed up', t.stale, 'PANs with overdue', '', t.stale ? 'amber' : '') +
      kpi('Open PTPs', inr(t.ptpAmt), t.ptpOpen + ' invoices') +
      kpi('Broken PTPs', t.broken, 'kept rate ' + pct(t.keptRate), '', t.broken ? 'red' : '') +
      kpi('Net payable', inr(t.netPayable), 'we owe these PANs') +
      kpi('Exposure PANs', t.exposureAccts, 'on the defaulting list') +
      kpi('IO signed', io.done, io.pending + ' pending') +
      kpi('IO incentive', '₹' + io.earned.toLocaleString('en-IN'), '₹' + io.earnedMonth.toLocaleString('en-IN') + ' this month', '', 'green') + '</div>';
    h += '<div class="cols2"><div class="card"><h3>Ageing</h3>' + ageBar({ b0: t.b[0], b1: t.b[1], b2: t.b[2], b3: t.b[3], b4: t.b[4], b5: t.b[5], b6: t.b[6] }) + '</div>' +
      '<div class="card"><h3>Collection confidence (R / A / G)</h3>' + (ragT ? '<div class="bar">' + [[t.red, '#ea4335', 'Red'], [t.yellow, '#fbbc04', 'Amber'], [t.green, '#34a853', 'Green']].map(function (x) {
        return x[0] ? '<div style="width:' + (x[0] / ragT * 100) + '%;background:' + x[1] + '" title="' + x[2] + ' ' + inr(x[0]) + '"></div>' : '';
      }).join('') + '</div><div class="blegend"><span><i style="background:#ea4335"></i>Red <b>' + inr(t.red) + '</b></span><span><i style="background:#fbbc04"></i>Amber <b>' + inr(t.yellow) + '</b></span><span><i style="background:#34a853"></i>Green <b>' + inr(t.green) + '</b></span></div>' +
        '<div class="faint small" style="margin-top:4px">' + pct(t.overdue ? ragT / t.overdue : 0) + ' of overdue has a confidence split</div>' : '<div class="faint">No R/A/G amounts entered yet.</div>') + '</div></div>';
    h += '<div class="card"><h3>Trend (nightly snapshots)</h3>' + ovTrend(d.trend) + '</div>';
    // Associates
    var cols = [['name', 'Associate'], ['teamLead', 'Team lead'], ['active', 'Active', 1], ['total', 'Total', 1, 1], ['overdue', 'Overdue', 1, 1], ['gt60', '>60', 1, 1], ['arap', 'AR-AP', 1, 1],
      ['todayCov', 'Today', 1, 2], ['mtdCov', 'MTD', 1, 2], ['stale', 'Not followed', 1], ['ptpAmt', 'Open PTP', 1, 1], ['broken', 'Broken', 1], ['keptRate', 'Kept %', 1, 2], ['ioDone', 'IO ✓', 1], ['ioPending', 'IO ⏳', 1]];
    var as = d.associates.slice().sort(function (a, b) { var x = a[S.ovSort.k], y = b[S.ovSort.k]; if (x === y) return 0; return (x > y ? 1 : -1) * S.ovSort.d; });
    h += '<div class="section-title">Associates</div><div class="table-wrap" style="margin-bottom:10px"><table><thead><tr>' + cols.map(function (c) {
      return '<th class="' + (c[2] ? 'r' : '') + '" data-osort="' + c[0] + '">' + c[1] + (S.ovSort.k === c[0] ? (S.ovSort.d > 0 ? ' ▲' : ' ▼') : '') + '</th>';
    }).join('') + '</tr></thead><tbody>' + as.map(function (a) {
      return '<tr class="clickable" data-assoc="' + esc(a.name) + '">' + cols.map(function (c) {
        var v = a[c[0]];
        return '<td class="' + (c[2] ? 'r num' : '') + '">' + (c[3] === 1 ? inr(v) : c[3] === 2 ? pct(v) : esc(v)) + '</td>';
      }).join('') + '</tr>';
    }).join('') + '<tr class="tot"><td>Total</td><td></td><td class="r num">' + t.active + '</td><td class="r num">' + inr(t.total) + '</td><td class="r num">' + inr(t.overdue) + '</td><td class="r num">' + inr(t.gt60) + '</td><td class="r num">' + inr(t.possibleArAp) + '</td>' +
      '<td class="r num">' + pct(t.todayCov) + '</td><td class="r num">' + pct(t.mtdCov) + '</td><td class="r num">' + t.stale + '</td><td class="r num">' + inr(t.ptpAmt) + '</td><td class="r num">' + t.broken + '</td><td class="r num">' + pct(t.keptRate) + '</td><td class="r num">' + io.done + '</td><td class="r num">' + io.pending + '</td></tr></tbody></table></div>';
    // Breakdowns
    var grp = function (title, list) {
      return '<div><div class="section-title">' + title + '</div><div class="table-wrap"><table><thead><tr><th></th><th class="r">PANs</th><th class="r">Overdue</th><th class="r">&gt;60</th><th class="r">AR-AP</th></tr></thead><tbody>' +
        list.map(function (g) { return '<tr><td class="ellipsis" style="max-width:170px" title="' + esc(g.key) + '">' + esc(g.key) + '</td><td class="r num">' + g.pans + '</td><td class="r num">' + inr(g.overdue) + '</td><td class="r num">' + inr(g.gt60) + '</td><td class="r num">' + inr(g.arap) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    };
    h += '<div class="cols3">' + grp('By business model', d.byModel) + grp('By BU head', d.byBu) + grp('By team lead', d.byTeamLead) + '</div>';
    h += '<div class="section-title">Top 20 overdue PANs</div>' + panList(d.topOverdue, 'owner');
    // Health
    h += '<div class="section-title" id="health">🩺 Data health checks</div><div class="list">' + d.health.map(function (c) {
      var ic = c.level === 'ok' ? '✅' : c.level === 'warn' ? '⚠️' : '🛑';
      return '<div class="health"><div class="ic">' + ic + '</div><div class="grow"><div style="font-weight:600">' + esc(c.title) + '</div><div class="muted small">' + esc(c.detail) + '</div>' +
        (c.items && c.items.length ? '<details style="margin-top:4px"><summary class="small" style="cursor:pointer;color:var(--accent)">Show ' + c.items.length + '</summary><div style="margin-top:4px">' + c.items.map(function (it) {
          return '<div class="small" style="padding:3px 0;border-bottom:1px dashed var(--line2)">' +
            (it.pan ? '<a href="#" data-open="' + esc(it.pan) + '">' + esc(it.pan) + '</a> ' : '') + (it.customer ? esc(it.customer) + ' · ' : '') + (it.owner ? '<b>' + esc(it.owner) + '</b> · ' : '') +
            (it.amount ? inr(it.amount) + ' · ' : '') + esc(it.note || '') + (c.id === 'unassigned' && it.pan ? ' <button class="btn sm" data-assign="' + esc(it.pan) + '">Assign…</button>' : '') + '</div>';
        }).join('') + '</div></details>' : '') + '</div></div>';
    }).join('') + '</div>';
    $('view').innerHTML = h;
    bindPanClicks();
    $('oRefresh').onclick = function () { S.overview = null; go('overview', true); };
    if ($('hJump')) $('hJump').onclick = function () { $('health').scrollIntoView({ behavior: 'smooth' }); };
    on('th[data-osort]', 'click', function (e, th) { var k = th.getAttribute('data-osort'); S.ovSort = { k: k, d: S.ovSort.k === k ? -S.ovSort.d : -1 }; renderOverview(); });
    on('[data-assoc]', 'click', function (e, tr) { var k = 'a:' + tr.getAttribute('data-assoc'); $('scope').value = k; setScope(k); go('pans'); });
    on('[data-open]', 'click', function (e, a) { e.preventDefault(); openPan(a.getAttribute('data-open')); });
    on('[data-assign]', 'click', function (e, b) { e.preventDefault(); reassignForm([b.getAttribute('data-assign')]); });
  }
  function ovTrend(tr) {
    if (!tr || tr.length < 2) return '<div class="faint">The trend fills in from the nightly snapshot (22:00). ' + (tr && tr.length ? '1 day so far.' : 'No snapshots yet – run “Take snapshot now” from the menu to start.') + '</div>';
    var W = 620, H = 150, pad = 34;
    var maxO = Math.max.apply(null, tr.map(function (x) { return x.overdue; }).concat([1]));
    var bw = (W - pad) / tr.length;
    var pts = tr.map(function (x, i) { return (pad + i * bw + bw / 2) + ',' + (H - x.overdue / maxO * (H - 12)); }).join(' ');
    var svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 18) + '" width="100%" role="img" aria-label="Overdue and coverage trend">';
    tr.forEach(function (x, i) {
      var bh = x.cov * (H - 12);
      svg += '<rect x="' + (pad + i * bw + 2) + '" y="' + (H - bh) + '" width="' + Math.max(bw - 4, 2) + '" height="' + bh + '" fill="#c9dafc"><title>' + fd(x.date) + ' · coverage ' + pct(x.cov) + '</title></rect>';
      if (i % Math.ceil(tr.length / 12) === 0) svg += '<text x="' + (pad + i * bw + bw / 2) + '" y="' + (H + 13) + '" font-size="9" text-anchor="middle" fill="#8a94a3">' + fds(x.date) + '</text>';
    });
    svg += '<polyline points="' + pts + '" fill="none" stroke="#c5221f" stroke-width="2"/>';
    tr.forEach(function (x, i) { svg += '<circle cx="' + (pad + i * bw + bw / 2) + '" cy="' + (H - x.overdue / maxO * (H - 12)) + '" r="2.5" fill="#c5221f"><title>' + fd(x.date) + ' · overdue ' + inr(x.overdue) + '</title></circle>'; });
    svg += '<text x="0" y="10" font-size="9" fill="#c5221f">' + inr(maxO) + '</text><line x1="' + pad + '" x2="' + W + '" y1="' + H + '" y2="' + H + '" stroke="#e3e6ea"/></svg>';
    return svg + '<div class="legend"><span><i class="dot" style="background:#c5221f"></i>Overdue</span><span><i class="dot" style="background:#c9dafc"></i>Coverage %</span></div>';
  }
})();
</script>
</body>
</html>
